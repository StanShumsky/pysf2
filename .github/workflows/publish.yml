name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

# Publish pipeline: test first, then upload to PyPI.
#
# Authentication uses the repository secret `PYPI_API_TOKEN` (a PyPI API
# token with upload access to the project). The upload is a plain
# `twine upload`; on failure the server response is re-emitted as `::error::`
# annotations so the exact cause is retrievable via the GitHub API.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e . pytest
      - name: Test
        run: pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check artifacts
        run: python -m twine check dist/*
      - name: Publish to PyPI (API token)
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -o pipefail
          out=$(python -m twine upload --non-interactive --verbose dist/* 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            # Re-emit the tail of the server response as annotations so the
            # exact failure is retrievable via the GitHub check-run API.
            echo "$out" | tail -n 45 | while IFS= read -r line; do
              echo "::error title=twine-upload-failed::${line}"
            done
            exit 1
          fi
