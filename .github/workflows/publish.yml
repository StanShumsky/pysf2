name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  # Required for PyPI trusted publishing (OIDC): GitHub issues a short-lived
  # identity token that PyPI matches against the project's configured
  # publisher (PyPI -> Project -> Add a new publisher -> GitHub ->
  # repository StanShumsky/pysf2, workflow publish.yml) and exchanges for a
  # 15-minute upload token. No API token / secret needed.
  id-token: write

# One publish pipeline: test first, then upload to PyPI via trusted
# publishing (OIDC) -- see the `id-token: write` permission below; the
# PyPI-side counterpart is the pending publisher you already added
# (pysf2 / GitHub / StanShumsky/pysf2 / publish.yml).
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e . pytest
      - name: Test
        run: pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # Job-level block supersedes the workflow-level one for this job.
      id-token: write    # PyPI trusted publishing (OIDC exchange)
      attestations: write  # PEP 740 attestations (the action's default) are
                        # uploaded via `gh attestation` before twine runs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build
      - name: Build sdist and wheel
        run: python -m build
      - name: Publish to PyPI (trusted publishing / OIDC)
        # No user/password: the action requests an OIDC token from GitHub
        # (id-token: write above) and PyPI mints a short-lived upload token
        # for the project(s) that trust this workflow.
        uses: pypa/gh-action-pypi-publish@release/v1
